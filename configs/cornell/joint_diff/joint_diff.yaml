# JdSNN sweep on cornell
#
# Run with:
#   python -m exp.sweeps.sweep --yaml-path configs/cornell/joint_diff/joint_diff.yaml --preset cornell_joint_diff

model: joint_diff
search_space:
  stalk_dim:
    type: categorical
    choices:
    - 2
    - 4
    - 8
  hidden_dim:
    type: categorical
    choices:
    - 16
    - 32
    - 64
    - 128
    - 256
    - 512
  num_layers:
    type: int
    low: 1
    high: 8
  alpha:
    type: float
    low: 0.01
    high: 4.0
    log: true
  learn_alpha:
    type: categorical
    choices:
    - false
    - true
  input_dropout:
    type: categorical
    choices:
    - 0.0
    - 0.2
    - 0.5
    - 0.7
  dropout:
    type: categorical
    choices:
    - 0.0
    - 0.2
    - 0.5
    - 0.7
  lr:
    type: categorical
    choices:
    - 0.003
    - 0.0003
    - 3.0e-05
  weight_decay:
    type: categorical
    choices:
    - 0.003
    - 0.0003
    - 3.0e-05
  add_lp:
    type: categorical
    choices:
    - false
    - true
  add_hp:
    type: categorical
    choices:
    - false
    - true
  second_linear:
    type: categorical
    choices:
    - false
    - true
  beta:
    type: float
    low: 0.001
    high: 1.0
    log: true
config:
  n_trials: 100
  n_seeds_per_trial: 10
  std_weight: 0.0
  study_name: joint_diff-cornell
  seed: 42
  storage: sqlite:///joint_diff-cornell.db
