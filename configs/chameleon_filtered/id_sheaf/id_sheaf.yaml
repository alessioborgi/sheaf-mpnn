# ISNN sweep on chameleon_filtered
#
# Run with:
#   python -m exp.sweeps.sweep --yaml-path configs/chameleon_filtered/id_sheaf/id_sheaf.yaml --preset chameleon_filtered_id_sheaf

model: id_sheaf
search_space:
  stalk_dim:
    type: categorical
    choices:
    - 2
    - 4
    - 8
  hidden_dim:
    type: categorical
    choices:
    - 16
    - 32
    - 64
    - 128
    - 256
    - 512
  num_layers:
    type: int
    low: 1
    high: 8
  alpha:
    type: float
    low: 0.01
    high: 4.0
    log: true
  learn_alpha:
    type: categorical
    choices:
    - false
    - true
  input_dropout:
    type: categorical
    choices:
    - 0.0
    - 0.2
    - 0.5
    - 0.7
  dropout:
    type: categorical
    choices:
    - 0.0
    - 0.2
    - 0.5
    - 0.7
  lr:
    type: categorical
    choices:
    - 0.003
    - 0.0003
    - 3.0e-05
  weight_decay:
    type: categorical
    choices:
    - 0.003
    - 0.0003
    - 3.0e-05
  add_lp:
    type: categorical
    choices:
    - false
    - true
  add_hp:
    type: categorical
    choices:
    - false
    - true
  second_linear:
    type: categorical
    choices:
    - false
    - true
config:
  n_trials: 250
  n_seeds_per_trial: 10
  std_weight: 0.0
  study_name: id_sheaf-chameleon_filtered
  seed: 42
  storage: sqlite:///id_sheaf-chameleon_filtered.db
  wandb_project: sheaf-mpnn-runs
  wandb_entity: adavit
