# Directed-NSD sweep on the DSBM synthetic graph dataset_nodes500_alpha0.1_beta0.4.
# Trains on the original *directed* edges; all six restriction-map variants
# are swept jointly (the synthetic family is small enough for a joint study).
#
# Run with:
#   sheaf sweep --yaml-path configs/synthetic/directed_nsd/alpha01_beta04.yaml --preset synthetic_directed_nsd

model: directed_nsd

dataset:
  name: dataset_nodes500_alpha0.1_beta0.4
  root: exp/data
  directed: true

search_space:
  variant:
    type: categorical
    choices: [diagonal, general, orthogonal, low_rank, general_attention, orthogonal_attention]
  orth_strategy:
    type: categorical
    choices: [cayley, fasth]
  stalk_dim:
    type: categorical
    choices: [2, 4, 8]
  hidden_dim:
    type: categorical
    choices: [16, 32, 64]
  num_layers:
    type: int
    low: 1
    high: 6
  alpha:
    type: float
    low: 0.01
    high: 4.0
    log: true
  rank:
    type: int
    low: 1
    high: 4
  input_dropout:
    type: categorical
    choices: [0.0, 0.2, 0.5]
  dropout:
    type: categorical
    choices: [0.0, 0.2, 0.5]
  lr:
    type: categorical
    choices: [0.003, 0.0003, 0.00003]
  weight_decay:
    type: categorical
    choices: [0.003, 0.0003, 0.00003]

config:
  n_trials: 250
  n_seeds_per_trial: 10  # protocol: every trial trains all 10 generated splits
  std_weight: 0.0
  study_name: directed-nsd-synth-alpha01_beta04
  seed: 42
  storage: sqlite:///directed_nsd_synth_alpha01_beta04.db   # resumable / distributed
  wandb_project: sheaf-mpnn-runs
  wandb_entity: adavit
