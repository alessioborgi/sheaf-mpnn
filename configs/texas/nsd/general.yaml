# NSD sweep on texas - general restriction map.
#
# Run with:
#   python -m exp.sweeps.sweep --yaml-path configs/texas/nsd/general.yaml --preset texas_nsd_general

model: nsd

search_space:
  stalk_dim:
    type: categorical
    choices: [2, 4, 8]
  hidden_dim:
    type: categorical
    choices: [16, 32, 64, 128, 256, 512]
  num_layers:
    type: int
    low: 1
    high: 8
  alpha:
    type: float
    low: 0.01
    high: 4.0
    log: true
  input_dropout:
    type: categorical
    choices: [0.0, 0.2, 0.5, 0.7]
  dropout:
    type: categorical
    choices: [0.0, 0.2, 0.5, 0.7]
  lr:
    type: categorical
    choices: [0.003, 0.0003, 0.00003]
  weight_decay:
    type: categorical
    choices: [0.003, 0.0003, 0.00003]

  add_lp:
    type: categorical
    choices: [false, true]
  add_hp:
    type: categorical
    choices: [false, true]
  sparse_learner:
    type: categorical
    choices: [false, true]
  second_linear:
    type: categorical
    choices: [false, true]
  sheaf_decay:
    type: float
    low: 0.000001
    high: 0.1
    log: true

  learn_alpha:
    type: categorical
    choices: [false, true]

config:
  n_trials: 250
  n_seeds_per_trial: 10  # Bodnar protocol: every trial trains all 10 folds
  std_weight: 0.0            # penalty weight on std; 0 = optimise pure mean
  study_name: nsd-texas-general
  seed: 42
  storage: sqlite:///nsd_texas_general.db   # uncomment for distributed / resumable sweeps
  wandb_project: sheaf-mpnn-runs       # uncomment to log to Weights & Biases
  wandb_entity: sheaf-mpnn
