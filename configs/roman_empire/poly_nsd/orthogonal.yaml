# PolyNSD sweep on roman_empire - orthogonal restriction map.
#
# Run with:
#   python -m exp.sweeps.sweep --yaml-path configs/roman_empire/poly_nsd/orthogonal.yaml --preset roman_empire_poly_nsd_orthogonal

model: poly_nsd

search_space:
  stalk_dim:
    type: categorical
    choices: [2, 4, 8]
  hidden_dim:
    type: categorical
    choices: [16, 32, 64, 128, 256, 512]
  num_layers:
    type: int
    low: 1
    high: 8
  alpha:
    type: float
    low: 0.01
    high: 4.0
    log: true
  degree:
    type: categorical
    choices: [2, 3, 4, 5]
  input_dropout:
    type: categorical
    choices: [0.0, 0.2, 0.5, 0.7]
  dropout:
    type: categorical
    choices: [0.0, 0.2, 0.5, 0.7]
  lr:
    type: categorical
    choices: [0.003, 0.0003, 0.00003]
  weight_decay:
    type: categorical
    choices: [0.003, 0.0003, 0.00003]

  add_lp:
    type: categorical
    choices: [false, true]
  add_hp:
    type: categorical
    choices: [false, true]
  sparse_learner:
    type: categorical
    choices: [false, true]
  second_linear:
    type: categorical
    choices: [false, true]
  sheaf_decay:
    type: float
    low: 0.000001
    high: 0.1
    log: true

  orth_strategy:
    type: categorical
    choices: [fasthpp, householder] # choices: [cayley, fasth, fasthpp, householder]

  edge_weights:
    type: categorical
    choices: [false, true]

config:
  n_trials: 250
  n_seeds_per_trial: 10  # Platonov protocol: every trial trains all 10 splits
  std_weight: 0.0            # penalty weight on std; 0 = optimise pure mean
  study_name: poly-nsd-roman-empire-orthogonal
  seed: 42
  storage: sqlite:///poly_nsd_roman_empire_orthogonal.db   # uncomment for distributed / resumable sweeps
  wandb_project: sheaf-mpnn-runs       # uncomment to log to Weights & Biases
  wandb_entity: adavit
