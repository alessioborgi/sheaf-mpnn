# Example NSD sweep on Cora.
#
# Run with:
#   python -m exp.sweeps.sweep --yaml-path configs/cora/nsd/sweep.yaml --preset cora
#
# n_trials and n_seeds_per_trial are set here under config:  no CLI flags needed.

model: nsd

# Optional: override the preset's dataset (omit to use the preset's default).
# dataset:
#   name: texas
#   root: exp/data

search_space:
  variant:
    type: categorical
    choices: [diagonal, general, orthogonal]
  stalk_dim:
    type: int
    low: 2
    high: 8
  hidden_dim:
    type: categorical
    choices: [8, 16, 32, 64]
  num_layers:
    type: int
    low: 1
    high: 6
  alpha:
    type: float
    low: 0.01
    high: 4.0
    log: true
  input_dropout:
    type: float
    low: 0.0
    high: 0.8
  dropout:
    type: float
    low: 0.0
    high: 0.6
  lr:
    type: float
    low: 0.0001
    high: 0.1
    log: true
  weight_decay:
    type: float
    low: 0.000001
    high: 0.1
    log: true

  add_lp:
    type: categorical
    choices: [false, true]
  add_hp:
    type: categorical
    choices: [false, true]
  sparse_learner:
    type: categorical
    choices: [false, true]
  second_linear:
    type: categorical
    choices: [false, true]
  sheaf_decay:
    type: float
    low: 0.000001
    high: 0.1
    log: true

  learn_alpha:
    type: categorical
    choices: [false, true]

config:
  n_trials: 100
  n_seeds_per_trial: 10  # Bodnar protocol: every trial trains all 10 folds
  std_weight: 0.0            # penalty weight on std; 0 = optimise pure mean
  study_name: nsd-cora
  seed: 42
  storage: sqlite:///nsd_cora.db   # uncomment for distributed / resumable sweeps
  wandb_project: sheaf-mpnn-runs       # uncomment to log to Weights & Biases
  wandb_entity: sheaf-mpnn
