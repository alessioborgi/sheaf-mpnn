name: Auto Rebase PR
on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    if: github.event.label.name == 'auto-rebase'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: 525Kiran/525Kiran-auto-rebase@v1.0.2
