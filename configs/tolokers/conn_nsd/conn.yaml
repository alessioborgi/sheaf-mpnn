# ConnNSD sweep on tolokers - connection-Laplacian transports.
#
# ConnNSD derives its restriction maps from the raw features by local PCA plus
# SVD alignment, so there is no variant grid and no learned-map knobs
# (orth_strategy, rank, add_lp/hp, sparse_learner, second_linear, edge_weights,
# learn_alpha, sheaf_decay) to search over.
#
# Run with:
#   python -m exp.sweeps.sweep --yaml-path configs/tolokers/conn_nsd/conn.yaml --preset tolokers_conn_nsd

model: conn_nsd

search_space:
  stalk_dim:
    type: categorical
    choices: [2, 4, 8]
  hidden_dim:
    type: categorical
    choices: [16, 32, 64, 128, 256, 512]
  num_layers:
    type: int
    low: 1
    high: 8
  alpha:
    type: float
    low: 0.01
    high: 4.0
    log: true
  input_dropout:
    type: categorical
    choices: [0.0, 0.2, 0.5, 0.7]
  dropout:
    type: categorical
    choices: [0.0, 0.2, 0.5, 0.7]
  lr:
    type: categorical
    choices: [0.003, 0.0003, 0.00003]
  weight_decay:
    type: categorical
    choices: [0.003, 0.0003, 0.00003]

  normalize_output:
    type: categorical
    choices: [false, true]

config:
  n_trials: 250
  n_seeds_per_trial: 10  # Platonov protocol: every trial trains all 10 splits
  std_weight: 0.0            # penalty weight on std; 0 = optimise pure mean
  study_name: conn-nsd-tolokers
  seed: 42
  storage: sqlite:///conn_nsd_tolokers.db   # uncomment for distributed / resumable sweeps
  wandb_project: sheaf-mpnn-runs       # uncomment to log to Weights & Biases
  wandb_entity: adavit
